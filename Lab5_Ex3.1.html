<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infographic và video</title>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 32px;
    }

    section {
      margin-bottom: 32px;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgb(0 0 0 / 8%);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Infographic và video hướng dẫn</h1>

    <section>
      <h2>Infographic</h2>
      <img
        src="https://cdn.imagetourls.com/uploads/tyImg/12W4THkEL.png"
        alt="Infographic tóm tắt các thông tin chính"
        loading="lazy"
      >
    </section>

    <section>
      <h2>Video YouTube</h2>
      <div class="video-wrapper">
        <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/b-WqshCwsqA?si=HB19MBRm1-79TGUA&amp;start=3" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen></iframe>
      </div>
    </section>
  </main>
</body>
</html>
